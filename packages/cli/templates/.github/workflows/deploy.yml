name: Deploy

# Not on every push: production changes when a release is approved (the version
# PR merges and release.yml calls this). Run it by hand to redeploy.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The D1 database is created on the first deploy and found by name after
      # that, so there is no id to copy around by hand.
      - name: Ensure the database
        working-directory: services/api
        run: |
          set -euo pipefail
          NAME=$(node -e "const c=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(/\"database_name\":\s*\"([^\"]+)\"/.exec(c)[1])")
          ID=$(pnpm exec wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name===process.argv[1]);console.log(db?db.uuid:'')})" "$NAME")
          if [ -z "$ID" ]; then
            pnpm exec wrangler d1 create "$NAME"
            ID=$(pnpm exec wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).find(d=>d.name===process.argv[1]).uuid))" "$NAME")
          fi
          sed -i "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$ID\"/" wrangler.jsonc
          pnpm exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the API
        working-directory: services/api
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy \
            --var CLERK_JWKS_URL:"${{ vars.CLERK_JWKS_URL }}" \
            --var CLERK_ISSUER:"${{ vars.CLERK_ISSUER }}" \
            --var ALLOWED_ORIGINS:"${{ vars.APP_ORIGIN }}"
          if [ -n "${CLERK_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$CLERK_WEBHOOK_SECRET" | pnpm exec wrangler secret put CLERK_WEBHOOK_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}

  # The app's web build — including its admin area — as a static site.
  web:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @app/mobile run export:web
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          set -euo pipefail
          pnpm --filter @app/api exec wrangler pages project create __PROJECT_NAME__ --production-branch main 2>/dev/null || true
          pnpm --filter @app/api exec wrangler pages deploy "$GITHUB_WORKSPACE/apps/mobile/dist" --project-name __PROJECT_NAME__ --branch main
          echo "url=${{ vars.APP_ORIGIN }}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
