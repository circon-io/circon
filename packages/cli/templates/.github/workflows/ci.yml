name: CI

on:
  pull_request:
  # Called by release.yml and deploy.yml, so nothing ships that did not pass.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # The same accessibility-tree check the circon gate runs, against the
      # Expo web build with the API running beside it.
      - name: UI gate (web)
        run: |
          if [ ! -x .circon/flows/web.sh ]; then echo "No web gate configured."; exit 0; fi
          npx --yes agent-device --version > /dev/null 2>&1 || npm install -g agent-device
          bash .circon/flows/web.sh
