name: Deploy control plane

on:
  push:
    branches: [main]
    paths:
      - 'packages/control-plane/**'
      - '.github/workflows/deploy-control-plane.yml'
  workflow_dispatch:

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the deploy an approval gate.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @circon/control-plane typecheck

      # Everything wrangler CAN declare lives in wrangler.jsonc: the Durable
      # Object and its migration, the assets binding, observability.
      #
      # A D1 database cannot be declared — `database_id` must exist before
      # deploy — so it is created here, idempotently, and its id written into
      # the config. Adopting an existing database is the normal path; creation
      # only happens on a fresh account.
      - name: Provision resources wrangler cannot declare
        working-directory: packages/control-plane
        run: node scripts/provision.mjs --write
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        working-directory: packages/control-plane
        run: npx wrangler d1 migrations apply circon --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        working-directory: packages/control-plane
        run: |
          set -euo pipefail
          # --domain attaches the Worker to a hostname on a zone you control.
          # Without it, and with workers_dev false, wrangler has nowhere to put
          # the Worker and fails asking for a workers.dev subdomain.
          # CLERK_JWKS_URL is a var, not a secret: it is a well-known endpoint
          # serving public keys. Nothing about it needs hiding.
          if [ -z "${{ vars.CLERK_JWKS_URL }}" ]; then
            echo "::error::CLERK_JWKS_URL variable is required — the API cannot verify sessions without it."
            exit 1
          fi
          npx wrangler deploy \
            --domain "${{ vars.CONTROL_PLANE_DOMAIN }}" \
            --var CLERK_JWKS_URL:"${{ vars.CLERK_JWKS_URL }}" \
            --var CLERK_ISSUER:"${{ vars.CLERK_ISSUER }}" \
            --var DASHBOARD_ORIGIN:"${{ vars.DASHBOARD_ORIGIN }}" \
            --var STRIPE_PRICE_PRO:"${{ vars.STRIPE_PRICE_PRO }}" \
            --var GH_APP_ID:"${{ vars.GH_APP_ID }}" \
            --var GH_APP_SLUG:"${{ vars.GH_APP_SLUG }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # After the deploy, not before: `wrangler secret put` targets an existing
      # Worker, so on a first run there is nothing to attach a secret to.
      # `secret put` publishes a new version, so the values take effect at once.
      - name: Sync secrets
        working-directory: packages/control-plane
        run: |
          set -euo pipefail

          # Required: the API cannot authenticate anyone without these, and a
          # silently skipped one shows up much later as "not configured" in the
          # dashboard. Fail here instead.
          require() {
            if [ -z "${2:-}" ]; then
              echo "::error::$1 is required but the repository secret is empty or unset."
              exit 1
            fi
            printf '%s' "$2" | npx wrangler secret put "$1"
            echo "  set $1"
          }

          # Optional: the feature named in $3 stays switched off until it exists.
          # Named explicitly, because "billing is off" and "GitHub is off" are
          # very different symptoms to debug from a dashboard that half works.
          optional() {
            if [ -n "${2:-}" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
              echo "  set $1"
            else
              echo "::warning::$1 is not set — $3"
            fi
          }

          require  CLERK_SECRET_KEY      "${{ secrets.CLERK_SECRET_KEY }}"
          require  RUNNER_SECRET_PEPPER  "${{ secrets.RUNNER_SECRET_PEPPER }}"
          optional STRIPE_SECRET_KEY     "${{ secrets.STRIPE_SECRET_KEY }}" \
                   "billing endpoints will return 503."
          optional STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
                   "plan changes made in Stripe will not reach Clerk."
          # The private key is multi-line PEM; printf '%s' keeps it byte-exact.
          optional GH_APP_PRIVATE_KEY "${{ secrets.GH_APP_PRIVATE_KEY }}" \
                   "projects cannot be connected and runners cannot clone."
          optional GH_WEBHOOK_SECRET  "${{ secrets.GH_WEBHOOK_SECRET }}" \
                   "an uninstalled GitHub App will not deactivate its projects."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
