name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'packages/dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @circon/dashboard typecheck

      # OpenNext builds Next for the Workers runtime, then deploys. Everything
      # it needs is declared in wrangler.jsonc; there is no resource to create
      # out of band, unlike the control plane's D1.
      # `pnpm run deploy`, not `pnpm deploy` — pnpm has a built-in `deploy`
      # command that shadows the script and fails with ERR_PNPM_NOTHING_TO_DEPLOY.
      - name: Build and deploy
        working-directory: packages/dashboard
        run: pnpm run deploy -- --domain "${{ vars.DASHBOARD_DOMAIN }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}

      - name: Sync secrets
        working-directory: packages/dashboard
        run: printf '%s' "${{ secrets.CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
