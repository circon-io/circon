name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'packages/website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @circon/website typecheck
      - run: pnpm --filter @circon/website test

      # A static export: `next build` writes out/, wrangler uploads it as
      # static assets plus the few lines of worker/index.ts that answer `/`.
      # No secrets, nothing to provision. NEXT_PUBLIC_SITE_URL is baked into
      # every canonical, hreflang and sitemap URL, so it must be the domain
      # the site is deployed to.
      - name: Build
        working-directory: packages/website
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ vars.WEBSITE_DOMAIN }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.DASHBOARD_ORIGIN }}

      # wrangler directly, not `pnpm run deploy -- --domain …`: pnpm passes the
      # `--` through, plain wrangler stops reading flags at it, and the deploy
      # "succeeds" with "No targets deployed" and no domain attached. (The
      # dashboard gets away with it because opennextjs-cloudflare forwards
      # everything after `--` to wrangler.)
      # On the zone's apex, --domain creates the DNS record itself; the apex
      # must have no other A/AAAA/CNAME record.
      - name: Deploy
        working-directory: packages/website
        run: |
          set -euo pipefail
          if [ -z "${{ vars.WEBSITE_DOMAIN }}" ]; then
            echo "::error::WEBSITE_DOMAIN variable is required — canonical URLs are built from it."
            exit 1
          fi
          npx wrangler deploy --domain "${{ vars.WEBSITE_DOMAIN }}" 2>&1 | tee deploy.log
          if grep -q "No targets deployed" deploy.log; then
            echo "::error::wrangler attached no domain; the site is uploaded but unreachable."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
