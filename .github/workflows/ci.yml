name: CI

on:
  pull_request:
  # Called by release.yml so a publish can never outrun its own checks.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from packageManager in package.json — specifying it here
      # as well makes action-setup error out with "Multiple versions of pnpm".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # init.sh and the gate flow templates are shell, and `bash -n` is the only
      # thing standing between a quoting mistake and a broken machine.
      - name: Shell syntax
        run: |
          bash -n init.sh
          for f in packages/cli/templates/.circon/flows/*.sh; do
            bash -n "$f"
          done

      - name: Build
        run: pnpm build

      # `files` in package.json is an allowlist, so a forgotten directory ships a
      # tarball that installs fine and then fails at runtime. Catch it here.
      - name: Verify publishable contents
        run: |
          cd packages/cli
          npm pack --dry-run --json | node scripts/verify-package.mjs
